<!DOCTYPE html>
<html>

<head>
    <title>Number guessing game</title>
    <link href="index.css" rel="stylesheet">
    <script type="module" src="main.js"></script>
</head>

<body>
    <div class="information-Container">
        <div id="money-Count">money ct: $</div>
        <div id="bet-Count">bet ct: $</div>
        <div id="min-Max-Count">min: $ | max: $</div>
        <div id="game-Title">Wise Roulette</div>
    </div>




    <div class="gameboard-Container1">

        <div class="chip-Pieces-Container">
            <img src="../Media/Images/pokerchip(1).png" alt="poker chip 1 did NOT load">
            <div class="Chip-$10">$10</div>
            <div class="Chip-$10">$20</div>
            <div class="Chip-$10">$100</div>
        </div>
        <div class="slot" id="slot0">0</div>

        <div class="gameboard-Container2">



            <div class="activeboard-Container">
                <div class="playboard-Container">
                    <div class="Column1">
                        <div class="_1to12Slots">
                            <div class="slot odd-Container" id="slot-3">3</div>
                            <div class="slot even-Container" id="slot-6">6</div>
                            <div class="slot odd-Container" id="slot-9">9</div>
                            <div class="slot even-Container" id="slot-12">12</div>
                            <!-- first row end -->
                            <div class="slot even-Container" id="slot-2">2</div>
                            <div class="slot odd-Container" id="slot-5">5</div>
                            <div class="slot even-Container" id="slot-8">8</div>
                            <div class="slot odd-Container" id="slot-11">11</div>
                            <!-- second row end -->
                            <div class="slot odd-Container" id="slot-1">1</div>
                            <div class="slot even-Container" id="slot-4">4</div>
                            <div class="slot odd-Container" id="slot-7">7</div>
                            <div class="slot even-Container" id="slot-10">10</div>
                            <!-- third row end -->
                        </div>

                    </div>

                    <div class="Column2">
                        <div class="_13to24Slots">
                            <div class="slot odd-Container" id="slot-15">13</div>
                            <div class="slot even-Container" id="slot-18">18</div>
                            <div class="slot odd-Container" id="slot-21">21</div>
                            <div class="slot even-Container" id="slot-24">24</div>
                            <!-- first row end -->
                            <div class="slot even-Container" id="slot-14">14</div>
                            <div class="slot odd-Container" id="slot-17">17</div>
                            <div class="slot even-Container" id="slot-20">20</div>
                            <div class="slot odd-Container" id="slot-23">23</div>
                            <!-- second row end -->
                            <div class="slot odd-Container" id="slot-13">13</div>
                            <div class="slot even-Container" id="slot-16">16</div>
                            <div class="slot odd-Container" id="slot-19">19</div>
                            <div class="slot even-Container" id="slot-22">22</div>
                            <!-- third row end -->
                        </div>

                    </div>

                    <div class="Column3">
                        <div class="_25to36Slots">
                            <div class="slot odd-Container" id="slot-27">27</div>
                            <div class="slot even-Container" id="slot-30">30</div>
                            <div class="slot odd-Container" id="slot-33">33</div>
                            <div class="slot even-Container" id="slot-36">36</div>
                            <!-- first row end -->
                            <div class="slot even-Container" id="slot-26">26</div>
                            <div class="slot odd-Container" id="slot-29">29</div>
                            <div class="slot even-Container" id="slot-32">32</div>
                            <div class="slot odd-Container" id="slot-35">35</div>
                            <!-- second row end -->
                            <div class="slot odd-Container" id="slot-25">25</div>
                            <div class="slot even-Container" id="slot-28">28</div>
                            <div class="slot odd-Container" id="slot-31">31</div>
                            <div class="slot even-Container" id="slot-34">34</div>
                            <!-- third row end -->
                        </div>


                    </div>
                </div>

                <div class="selectionboard-Container">
                    <div class="category-Selections-Row-1">
                        <div class="selection-Category-1st12 category-Option">1-12</div>
                        <div class="selection-Category-2nd12 category-Option">13-24</div>
                        <div class="selection-Category-3rd12 category-Option">25-36</div>
                    </div>
                    <div class="category-Selections-Row-2">
                        <div class="selection-Category-1to18 category-Option">1-18</div>
                        <div class="selection-Category-Even category-Option">Evens</div>

                        <div class="selection-Category-Black category-Option">blk</div>
                        <div class="selection-Category-Red category-Option">rd</div>

                        <div class="selection-Category-Odd category-Option">Odds</div>
                        <div class="selection-Category-19to36 category-Option">19-36</div>
                    </div>
                </div>
            </div>

        </div>

        <div class="History-Container">
            history
        </div>


    </div>



</body>


</html>
