<!DOCTYPE html>
<html>
    <head>
        <link href="index.css" rel="stylesheet">
        <script async src="main.js"></script>
    </head>
    <body>
        <div class="roulette-title-container">
            <div class="currency-tab" id="money">
                <div id="money-label">MONEY</div>
                <div id="money-amount"></div>
            </div>  
            <div class="currency-tab" id="bet">
                <div id="bet-label">BET</div>
                <div id="bet-amount"></div>
            </div>  
            <div class="currency-tab" id="minmax">
                <div>MIN BET: 1</div>
                <div>MAX BET: 1000</div>
            </div>
            <div class="title">
                <h2>ROUTLETTE</h2>
                <h4>By PGC Devs</h4>
            </div>
        </div>
        <div class="roulette-table-container">
            <div class="roulette-chips-container">

            </div>
            <div class="roulette-board-container">
                <div id="column1">
                    <div class="numbers"> 
                        <div class="number _1st12 _1to18 odd red" id="_3">3</div>
                        <div class="number _1st12 _1to18 even red" id="_6">6</div>
                        <div class="number _1st12 _1to18 odd red" id="_9">9</div>
                        <div class="number _1st12 _1to18 even red" id="_12">12</div>
                        
                        <div class="number _1st12 _1to18 even black" id="_2">2</div>
                        <div class="number _1st12 _1to18 odd black" id="_5">5</div>
                        <div class="number _1st12 _1to18 even black" id="_8">8</div>
                        <div class="number _1st12 _1to18 odd black" id="_11">11</div>
                        
                        <div class="number _1st12 _1to18 odd red" id="_1">1</div>
                        <div class="number _1st12 _1to18 even red" id="_4">4</div>
                        <div class="number _1st12 _1to18 odd red" id="_7">7</div>
                        <div class="number _1st12 _1to18 even red" id="_10">10</div>

                        
                        
                    </div>
                    <div class="side-bets">
                        <div class="bet" id="_1st12"> 1st 12 </div>
                        <div class="bet" id="_1to18"> 1 to 18 </div>
                        <div class="bet" id="even"> EVEN </div>
                    </div>
                </div>

                <div id="column2">
                    <div class="numbers"> 
                        <div class="number _2nd12 _1to18 odd red" id="_15">15</div>
                        <div class="number _2nd12 _1to18 even red" id="_18">18</div>
                        <div class="number _2nd12 _19to36 odd red" id="_21">21</div>
                        <div class="number _2nd12 _19to36 even red" id="_24">24</div>
                        
                        <div class="number _2nd12 _1to18 even black" id="_14">14</div>
                        <div class="number _2nd12 _1to18 odd black" id="_17">17</div>
                        <div class="number _2nd12 _19to36 even black" id="_20">20</div>
                        <div class="number _2nd12 _19to36 odd black" id="_23">23</div>
                        
                        <div class="number _2nd12 _1to18 odd red" id="_13">13</div>
                        <div class="number _2nd12 _1to18 even red" id="_16">16</div>
                        <div class="number _2nd12 _19to36 odd red" id="_19">19</div>
                        <div class="number _2nd12 _19to36 even red" id="_4">22</div>
                    </div>
                    <div class="side-bets">
                        <div class="bet" id="_2nd12"> 1st 12 </div>
                        <!-- <div class="bet" id="_19to36"> 19 to 36 </div> -->
                        <div class="bet" id="red"> RED </div>
                        <div class="bet" id="black"> BLACK </div>
                    </div>
                </div>

                <div id="column3">
                    <div class="numbers"> 
                        <div class="number _2nd12 _1to18 odd red" id="_15">15</div>
                        <div class="number _2nd12 _1to18 even red" id="_18">18</div>
                        <div class="number _2nd12 _19to36 odd red" id="_21">21</div>
                        <div class="number _2nd12 _19to36 even red" id="_24">24</div>
                        
                        <div class="number _2nd12 _1to18 even black" id="_14">14</div>
                        <div class="number _2nd12 _1to18 odd black" id="_17">17</div>
                        <div class="number _2nd12 _19to36 even black" id="_20">20</div>
                        <div class="number _2nd12 _19to36 odd black" id="_23">23</div>
                        
                        <div class="number _2nd12 _1to18 odd red" id="_13">13</div>
                        <div class="number _2nd12 _1to18 even red" id="_16">16</div>
                        <div class="number _2nd12 _19to36 odd red" id="_19">19</div>
                        <div class="number _2nd12 _19to36 even red" id="_4">22</div>
                    </div>
                    <div class="side-bets">
                        <div class="bet" id="_2nd12"> 1st 12 </div>
                        <!-- <div class="bet" id="_19to36"> 19 to 36 </div> -->
                        <div class="bet" id="red"> RED </div>
                        <div class="bet" id="black"> BLACK </div>
                    </div>
                </div>
            </div>
            <div class="roulette-history-container">

            </div>
        </div>
    </body>
</html>
