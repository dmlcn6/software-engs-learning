<!DOCTYPE html>
<html>
    <head>
        <link href="index.css" rel="stylesheet">
        <script async src="main.js"></script>
    </head>
    <body>
        <div class="roulette-title-container">
            <div class="currency-tab" id="money">
                <div id="money-label">MONEY</div>
                <div id="money-amount"></div>
            </div>  
            <div class="currency-tab" id="bet">
                <div id="bet-label">BET</div>
                <div id="bet-amount"></div>
            </div>  
            <div class="currency-tab" id="minmax">
                <div>MIN BET: 1</div>
                <div>MAX BET: 1000</div>
            </div>
            <div class="title">
                <h2>ROUTLETTE</h2>
                <h4>By PGC Devs</h4>
            </div>
        </div>
        <div class="roulette-table-container">
            <div class="roulette-chips-container">

            </div>
            <div class="roulette-board-container">
                <div id="column1">
                    <div class="numbers"> 
                        <div class="_1st12 _1to18 odd red" id="_3">3</div>
                        <div class="_1st12 _1to18 even black" id="_2">2</div>
                        <div class="_1st12 _1to18 odd red" id="_1">1</div>

                        <div class="_1st12 _1to18 odd red" id="_6">6</div>
                        <div class="_1st12 _1to18 even black" id="_5">5</div>
                        <div class="_1st12 _1to18 odd red" id="_4">4</div>

                        
                    </div>
                    <div class="bets">
                        <div id="_1st12"> 1st 12 </div>
                        <div class="_1to18"> 1 to 18 </div>
                        <div class="even"> EVEN </div>
                    </div>
                </div>
            </div>
            <div class="roulette-history-container">

            </div>
        </div>
    </body>
</html>
